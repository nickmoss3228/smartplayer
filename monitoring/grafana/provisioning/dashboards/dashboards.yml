apiVersion: 1

providers:
  - name: smartplayer
    orgId: 1
    folder: smartplayer
    type: file
    disableDeletion: false
    # Picks up edits to the JSON files without a Grafana restart.
    updateIntervalSeconds: 30
    # Lets you tweak a panel in the UI and keep it until the next file change —
    # without this, edits are rejected outright and iterating is painful.
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
