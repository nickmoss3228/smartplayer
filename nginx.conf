server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers (CSP, HSTS, nosniff, ...) live in nginx-security-headers.conf
    # and are included in EACH location below that serves the app, not here:
    # a location with its own add_header drops every server-level one. A new
    # location that serves pages or files needs the include line too.

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript
                application/xml+rss application/wasm image/svg+xml font/woff2
                application/manifest+json;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Proxy the API to the backend container so the browser makes SAME-ORIGIN
    # requests and CORS never enters the picture.
    #
    # proxy_pass is built from a variable on purpose: with a literal hostname
    # nginx resolves it once at startup and refuses to boot if the backend is
    # down. Via a variable + Docker's embedded DNS (127.0.0.11) resolution
    # happens per-request, so the frontend survives the backend being
    # restarted or deployed independently.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # audio uploads from the Story Builder are far bigger than the 1m default
        client_max_body_size 100m;
        proxy_read_timeout 120s;
    }

    # The sitemap is built by the backend from the published stories
    # (backend/src/controllers/sitemap.controller.js), so a story is listed the
    # moment it is published. It used to be a file generated at build time from
    # a hard-coded story list, which drifted. Same variable-upstream pattern as
    # /api/ above; the Dockerfile's sed rewrites this upstream for staging too.
    location = /sitemap.xml {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream/api/sitemap.xml;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Per-page copies of index.html with that page's <title>, description,
    # canonical and Open Graph tags baked in, written by
    # scripts/build-static-pages.mjs. Telegram and VK read only the raw HTML,
    # so without these every shared link previews as the bare homepage. The
    # route locations below serve them via try_files; `internal` keeps
    # /_pages/... itself from being a second, duplicate URL for each page.
    location ^~ /_pages/ {
        internal;
    }

    # Vite's hashed build output — safe to cache forever, immutably
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html must stay revalidated so a new deploy is picked up
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # nginx's bundled mime.types has no entry for .webmanifest, so the manifest
    # would go out as application/octet-stream and the browser would refuse to
    # parse it — silently costing installability while the site otherwise looks
    # completely fine.
    #
    # Scoped to this one file via default_type rather than a `types { }` block:
    # a types block inside `server` REPLACES the inherited table from
    # `include mime.types` instead of extending it, which would send every
    # stylesheet and script out as octet-stream too.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ── SPA routing, and why this is not one blanket fallback ────────────────
    #
    # This used to be a single `location / { try_files $uri $uri/ /index.html; }`
    # which returned the app shell at **200** for literally any path. Combined
    # with React Router's old catch-all (`path="*"` -> Navigate to "/"), that
    # meant https://малако.рф/anything-at-all answered 200 and rendered the
    # homepage. Search engines call this a soft 404: an infinite space of URLs
    # that all claim to be real pages with duplicate content. It burns crawl
    # budget, which a three-week-old domain has very little of, and at scale it
    # suppresses indexation of the pages that ARE real.
    #
    # Fixed by splitting the one location into three, in nginx's matching
    # order (exact `=` first, then regex, then prefix):
    #
    #   1. known app routes  -> shell at 200
    #   2. real files        -> the file
    #   3. anything else     -> shell at **404**
    #
    # Case 3 is the important one. The body is still index.html, so the user
    # gets the app's branded NotFound page instead of nginx's grey default —
    # but the status line says 404, which is what crawlers actually read.
    # `error_page` preserves the original status unless told otherwise (that
    # would be `error_page 404 =200 ...`), so this is a real 404, not a
    # cosmetic one.

    # 1a'. A hidden draft of the landing, kept out of search indexes by header as
    # well as by the page's own robots meta. Exact match, so it outranks the
    # regex below (which also lists it, for src/nginxRoutes.test.ts).
    location = /landing-demo {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files /index.html =404;
    }

    # 1a. Known SPA routes.
    #
    # ⚠ THIS LIST MUST BE KEPT IN SYNC WITH THE <Route> TABLE IN src/App.tsx.
    # A route added there and forgotten here will 404 on hard refresh and deep
    # links while working fine during client-side navigation — which makes it
    # look like a routing bug in React rather than a web-server config that was
    # never updated. If prerendering lands (docs/seo-plan.md §3) this whole
    # block disappears: prerendered routes become real files on disk and case 2
    # handles them without a hand-maintained list.
    #
    # A regex location outranks the `/assets/` and `/api/` prefix blocks above,
    # so the alternatives here are deliberately narrow — none of them can match
    # those paths.
    #
    # legal, listen and kopilka were missing until 2026-11-17, so the legal
    # pages, shared recordings and the копилка answered 404 to crawlers and to
    # payment-provider checks while rendering fine in a browser. The test in
    # src/nginxRoutes.test.ts now fails the build's test run when App.tsx gains
    # a top-level route this list does not cover.
    #
    # /_pages$uri.html is the page's own copy with its meta tags (see the
    # /_pages/ block above); routes without one get the generic shell.
    location ~ ^/(levels|how-to-use|login|signup|forgot-password|welcome|dashboard|room|game|players|player|admin|library|shop|stories|checkout|kopilka|legal|listen|landing-demo)(/|$) {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files /_pages$uri.html /index.html =404;
    }

    # 1b. The homepage. Exact match so it cannot be confused with case 3.
    location = / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files /_pages/index.html /index.html =404;
    }

    # 2 + 3. Real files (robots.txt, favicon, icons, audio) served
    # as themselves; everything unrecognised falls through to a genuine 404
    # that still renders the app.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ =404;
        error_page 404 /index.html;
    }
}
