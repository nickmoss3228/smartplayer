name: Deploy backend

# Mirrors deploy-frontend.yml, but scoped to backend/** so the two never
# trigger each other. The frontend workflow has backend/** in its paths-ignore.
on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build and push
        working-directory: backend
        run: |
          # --provenance/--sbom false: cr.yandex rejects buildx's default OCI
          # attestation manifests AFTER uploading layers, leaving the image
          # pushed but untagged.
          docker build --provenance=false --sbom=false \
            -t cr.yandex/${{ vars.YC_REGISTRY_ID }}/smartplayer-backend:${{ github.sha }} \
            -t cr.yandex/${{ vars.YC_REGISTRY_ID }}/smartplayer-backend:latest \
            .
          docker push cr.yandex/${{ vars.YC_REGISTRY_ID }}/smartplayer-backend:${{ github.sha }}
          docker push cr.yandex/${{ vars.YC_REGISTRY_ID }}/smartplayer-backend:latest

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_SSH_HOST }}
          username: deploy
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/smartplayer
            TOKEN=$(curl -s -H "Metadata-Flavor: Google" \
              "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token" \
              | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
            echo "$TOKEN" | docker login --username iam --password-stdin cr.yandex
            docker compose pull backend
            # --no-build: the VM has no backend source, only the pulled image
            docker compose up -d --no-build backend
            docker image prune -f
            # fail the deploy if the container isn't healthy within ~60s
            for i in $(seq 1 12); do
              sleep 5
              s=$(docker inspect smartplayer-backend --format '{{.State.Health.Status}}' 2>/dev/null || echo starting)
              echo "health=$s"
              [ "$s" = "healthy" ] && exit 0
            done
            echo "backend did not become healthy; recent logs:"
            docker compose logs --tail 40 backend
            exit 1
