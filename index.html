<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- href was empty here, which made the browser request the page itself as
         the icon and log a decode error on every load. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#0a0a0a" />
    <!-- viewport-fit=cover lets the page paint into the notch/home-indicator
         area once it is launched from the home screen with no browser chrome
         around it. Without it iOS letterboxes standalone apps in white. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="малако — тренажёр английского аудирования: слушай настоящие истории без субтитров."
    />

    <!-- ── Installable web app ──────────────────────────────────────────
         The manifest is what makes "Add to Home Screen" produce a real app
         window: display:standalone drops the URL bar and tabs entirely.

         crossorigin="use-credentials" is required, not decorative. A manifest
         is fetched with credentials OMITTED by default, so on any origin behind
         HTTP auth the fetch 401s on its own — and because the browser re-fetches
         the manifest on navigation, that surfaces as a login prompt on every
         page change. This bit the staging site (test.малако.рф, behind
         basic_auth); production is unauthenticated so the attribute is a no-op
         there. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />

    <!-- iOS ignored the manifest until 16.4, and still will not use its icons
         for the home screen, so these stay. apple-touch-icon must be a plain
         square: iOS rounds the corners itself, and a pre-rounded source gets
         rounded twice. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default", not "black-translucent". black-translucent makes iOS hand
         the web view the full screen and paint the status bar on top of it —
         which would put the clock and battery straight over the fixed navbar,
         since it sits at top-0 with no safe-area padding. Going immersive
         later means adding padding-top: env(safe-area-inset-top) to the nav
         first; until then "default" reserves the strip properly. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="малако" />

    <title>малако</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
