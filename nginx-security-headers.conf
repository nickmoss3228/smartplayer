# Security headers for every page and static file the frontend serves.
#
# Copied by the Dockerfile to /etc/nginx/snippets/security-headers.conf and
# `include`d by each location in nginx.conf that serves the app. Added
# 2026-11-17; until then the HTML origin sent none of these.
#
# WHY IT IS INCLUDED PER LOCATION and not once at server level: nginx's
# add_header is inherited from the enclosing level ONLY by a location that has
# no add_header of its own. Every app location here sets Cache-Control, so a
# server-level copy would silently vanish from exactly the responses it is for.
# /api/ deliberately does NOT include it: the backend's helmet already sends
# its own (stricter, JSON-only) set, and two CSP headers are both enforced.
#
# `always` so the soft-404 page (index.html served with status 404) carries the
# headers too; without it nginx adds them to 2xx/3xx responses only.

# Browsers remember to use HTTPS for a year. Caddy terminates TLS in front of
# this container; the header passes through. No includeSubDomains / preload:
# both are hard to walk back and buy nothing for a single-host site.
add_header Strict-Transport-Security "max-age=31536000" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The microphone is used by the player's repeat mode (same origin only).
# Everything else listed here the app never uses, so no embedded frame or
# injected script may ask for it either.
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;

# Content-Security-Policy. The session token lives in localStorage, so an XSS
# is an account takeover; the point of this policy is that injected markup
# cannot run script: no 'unsafe-inline' and no 'unsafe-eval' in script-src.
# That is why the Metrika snippet moved from an inline <script> in index.html
# to public/metrika.js.
#
# What each allowance is for (check before removing one):
#   'wasm-unsafe-eval'           yoga-layout (WebAssembly) inside @react-pdf, for
#                                the PDF handout. Allows WebAssembly compilation
#                                only, not eval() or new Function().
#   mc.yandex.ru / .com,
#   yastatic.net                 Yandex Metrika and Webvisor (Yandex's own CSP list).
#   storage.yandexcloud.net      Yandex Object Storage: audio, images, story
#                                assets, for both the production and the staging
#                                bucket (fetched by wavesurfer, so connect-src too).
#   style-src 'unsafe-inline'    React style={} attributes, styled-components and
#                                framer-motion all write inline styles. Styles
#                                cannot run script, so this costs little.
#   blob: / data:                recorded repeat-mode clips, the generated PDF,
#                                the WebAssembly inlined in the PDF chunk (it
#                                fetch()es its own data: URL, hence connect-src),
#                                the comic-focus worker, inlined small assets.
#   frame-ancestors              only this site and Metrika's click map / Webvisor
#                                player may frame the pages (clickjacking guard;
#                                this replaces X-Frame-Options, which cannot list
#                                several origins).
# The API is same-origin (/api/ through this nginx), so 'self' covers it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://mc.yandex.ru https://mc.yandex.com https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://storage.yandexcloud.net https://mc.yandex.ru https://mc.yandex.com; media-src 'self' blob: data: https://storage.yandexcloud.net; connect-src 'self' data: https://storage.yandexcloud.net https://mc.yandex.ru https://mc.yandex.com wss://mc.yandex.ru wss://mc.yandex.com; font-src 'self' data:; worker-src 'self' blob:; child-src 'self' blob: https://mc.yandex.ru https://mc.yandex.com; frame-src 'self' blob: https://mc.yandex.ru https://mc.yandex.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://metrika.yandex.ru https://metrika.yandex.by https://metrika.yandex.kz https://metrica.yandex.com https://metrica.yandex.com.tr https://webvisor.com https://*.webvisor.com" always;
